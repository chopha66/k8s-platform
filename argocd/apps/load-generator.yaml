apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: load-generator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/chopha66/k8s-platform.git
    targetRevision: master
    path: demo-apps/load-generator/kustomize/overlays
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true