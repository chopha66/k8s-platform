# frontend — 진입점 API (prometheus-example-app, /metrics 내장)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: frontend
    spec:
      containers:
        - name: app
          image: quay.io/brancz/prometheus-example-app:v0.5.0
          ports:
            - name: http
              containerPort: 8080
            - name: alternative
              containerPort: 9090
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi